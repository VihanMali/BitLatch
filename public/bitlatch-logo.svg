<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">BitLatch four-way symmetric symbol concept</title>
  <desc id="desc">Four matching teal latch forms meet at a shared center on a transparent background.</desc>
  <g transform="translate(360 360)" shape-rendering="geometricPrecision">
    <!-- One latch module, repeated in four exact quarter turns. -->
    <g id="arm">
      <path d="M-38-55v-145l-48-48v-58l48-48h76l48 48v58l-48 48v145h-76Z" fill="#168ca1"/>
      <!-- inset terminal and trace give each latch a precise technical finish -->
    </g>
    <use href="#arm" transform="rotate(90)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(270)"/>
    <!-- Shared hub locks all four arms into one mark. -->
    <path d="M0-49 49 0 0 49-49 0 0-49Z" fill="#168ca1"/>
  </g>
</svg>
